name: Bug report
description: Report a reproducible problem with the component or demo
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Slidev and Node.js versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a minimal example or repository if possible.
    validations:
      required: true
