name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm run test:pages
      - run: npx playwright install --with-deps chromium
      - run: |
          ./node_modules/.bin/slidev --port 3030 --base /demo/ > /tmp/slidev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3030/demo/ > /dev/null; then break; fi
            sleep 1
          done
          if ! curl --fail --silent http://localhost:3030/demo/ > /dev/null; then cat /tmp/slidev.log; exit 1; fi
          npm run test:component

